# Private, single-owner development relay. No literal credentials belong here.
# The launcher pins these addresses and supplies secrets only through its process environment.
control_plane:
  base_url: https://api.openai.com
  api_key: env:CONTROL_PLANE_API_KEY
mcp:
  server_urls:
    - channel: main
      url: http://127.0.0.1:8788/mcp
  extra_headers:
    Authorization: env:APC_TUNNEL_MCP_AUTHORIZATION
  discovery_extra_headers:
    Authorization: env:APC_TUNNEL_MCP_AUTHORIZATION
health:
  listen_addr: 127.0.0.1:8790
log:
  level: warn
  format: json
