<text x="1283" y="232.2" text-anchor="start" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="400" fill="#c2bbb0">Recovered from earlier chats and implementation records.</text>
<rect x="1283" y="265" width="88" height="38" rx="18" fill="#ecad33"/>
<text x="1327" y="287.2" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" fill="#24221f">1 → 2</text>
<text x="1389" y="285.75" text-anchor="start" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="700" fill="#f6f3ed">Remove duplicate screen text</text>
<text x="1389" y="319.29" text-anchor="start" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="400" fill="#c2bbb0">Omit visible text repeated exactly in returned action labels.</text>
<rect x="1283" y="367" width="88" height="38" rx="18" fill="#ecad33"/>
<text x="1327" y="389.2" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" fill="#24221f">2 → 3</text>
<text x="1389" y="387.75" text-anchor="start" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="700" fill="#f6f3ed">Reduce redundant tool responses</text>
<text x="1389" y="421.29" text-anchor="start" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="400" fill="#c2bbb0">Full data once; shorter status/guidance + per-call gap reporting.</text>
<rect x="1283" y="469" width="88" height="38" rx="18" fill="#ecad33"/>
<text x="1327" y="491.2" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" fill="#24221f">3 → 4</text>
<text x="1389" y="489.75" text-anchor="start" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="700" fill="#f6f3ed">850 ms post-send delivery check</text>
<text x="1389" y="523.29" text-anchor="start" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="400" fill="#c2bbb0">Read immediately; return early on delivery; never resend.</text>
<rect x="1283" y="571" width="88" height="38" rx="18" fill="#ecad33"/>
<text x="1327" y="593.2" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" fill="#24221f">4 → 5</text>
<text x="1389" y="591.75" text-anchor="start" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="700" fill="#f6f3ed">One conditional send workflow</text>
<text x="1389" y="625.29" text-anchor="start" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="400" fill="#c2bbb0">Separate assistant exchanges → one guarded server workflow.</text>
<rect x="1283" y="673" width="88" height="38" rx="18" fill="#ecad33"/>
<text x="1327" y="695.2" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" fill="#24221f">5 → 6</text>
<text x="1389" y="693.75" text-anchor="start" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="700" fill="#f6f3ed">Recognize the observed S23+ layout</text>
<text x="1389" y="727.29" text-anchor="start" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="400" fill="#c2bbb0">Added conversation-row and toolbar IDs after Run 5 stopped.</text>
<rect x="1283" y="775" width="88" height="38" rx="18" fill="#ecad33"/>
<text x="1327" y="797.2" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" fill="#24221f">6 → 7</text>
<text x="1389" y="795.75" text-anchor="start" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="700" fill="#f6f3ed">Recognize a truly empty RCS composer</text>
<text x="1389" y="829.29" text-anchor="start" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="400" fill="#c2bbb0">Require placeholder + voice-record evidence + no Send.</text>
<rect x="1283" y="877" width="88" height="38" rx="18" fill="#ecad33"/>
<text x="1327" y="899.2" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" fill="#24221f">7 → 8</text>
<text x="1389" y="897.75" text-anchor="start" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="700" fill="#f6f3ed">Command polling + launch readiness</text>
<text x="1389" y="931.29" text-anchor="start" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="400" fill="#c2bbb0">Remove 750 ms command-loop sleep; check launch readiness.</text>
<rect x="1283" y="979" width="88" height="38" rx="18" fill="#ecad33"/>
